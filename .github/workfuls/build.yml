name: Build Qt Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Позволяет запустить вручную

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts qtnetworkauth'
          cache: 'true'

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Deploy Qt libraries
        shell: cmd
        run: |
          cd build\Release
          windeployqt --release --no-translations InformationBoard.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: InformationBoard-Windows
          path: build/Release/
          retention-days: 14

  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt5 and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev \
            qtmultimedia5-dev \
            libqt5sql5-sqlite \
            libqt5multimedia5-plugins \
            cmake \
            g++

      - name: Configure and Build
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: InformationBoard-Linux
          path: build/InformationBoard
          retention-days: 14