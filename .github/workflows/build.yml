name: Build Qt Application

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*' # Запускать создание релиза только при пуше тега (например, v1.0.0)
  workflow_dispatch:

# Разрешаем экшенам создавать релизы и прикреплять файлы
permissions:
  contents: write

jobs:
  build-linux:
    name: Build Release on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt5
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtmultimedia5-dev libqt5sql5-sqlite cmake g++

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Upload Linux artifact (для тестов во вкладке Actions)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: InformationBoard-Linux
          path: build/InformationBoard
          retention-days: 14

      - name: Upload Linux to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/InformationBoard
          generate_release_notes: true

  build-windows:
    name: Build Release on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt via aqt
        run: |
          pip install aqtinstall
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 --outputdir D:\Qt

      - name: Configure
        run: cmake -B build -DCMAKE_PREFIX_PATH=D:\Qt\5.15.2\msvc2019_64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Prepare distribution folder
        run: |
          mkdir dist
          $exePath = Get-ChildItem -Path build -Recurse -Filter "InformationBoard.exe" | Select-Object -First 1
          if ($exePath) {
            Copy-Item $exePath.FullName -Destination dist\
            Write-Host "Found EXE at: $($exePath.FullName)"
          } else {
            Write-Error "InformationBoard.exe not found!"
            exit 1
          }

      - name: Deploy Qt libraries
        shell: cmd
        run: D:\Qt\5.15.2\msvc2019_64\bin\windeployqt.exe --release --no-translations dist\InformationBoard.exe

      - name: Create Single EXE (7z SFX)
        shell: cmd
        run: |
          :: Скачиваем 7-Zip
          curl -L -o 7z.exe https://7-zip.org/a/7z2408-x64.exe
          7z.exe /S /D=C:\7z
          
          :: Создаём конфиг для абсолютно скрытой распаковки и запуска
          echo ;!@Install@!UTF-8!> config.txt
          echo Title="Information Board">> config.txt
          echo RunProgram="InformationBoard.exe">> config.txt
          echo GUIMode="2">> config.txt
          echo ;!@InstallEnd@!>> config.txt
          
          :: Пакуем всё в один файл
          C:\7z\7z.exe a -sfx"C:\7z\7z.sfx" -r dist\InformationBoard_Single.exe dist\* config.txt

      - name: Upload Windows artifact (для тестов во вкладке Actions)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: InformationBoard-Windows-Single
          path: dist/InformationBoard_Single.exe
          retention-days: 14

      - name: Upload Windows Single EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/InformationBoard_Single.exe
          generate_release_notes: true