name: Build Qt Application

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt5
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtmultimedia5-dev libqt5sql5-sqlite cmake g++

      - name: Build
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: InformationBoard-Linux
          path: build/InformationBoard
          retention-days: 14

  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt libraries
        run: windeployqt --release --no-translations build/Release/InformationBoard.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: InformationBoard-Windows
          path: build/Release/
          retention-days: 14